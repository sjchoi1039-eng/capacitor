<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f9ff">
<meta name="description" content="캐패시터 코드와 정전용량을 양방향으로 변환하는 계산기">
<title>캐패시터 용량 계산기</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;color:#17243b;background:#f5f9ff;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 14px}
.app{width:min(100%,475px);background:#fff;border:1.5px solid #8bc0ff;border-radius:20px;padding:27px 24px 22px;box-shadow:0 15px 45px rgba(33,90,158,.09)}
header{text-align:center}.badge{display:inline-block;background:#e7f1ff;color:#2463ca;border-radius:999px;font-size:11px;font-weight:750;letter-spacing:.07em;padding:6px 12px}
h1{font-size:25px;margin:13px 0 7px;letter-spacing:-.055em}header p{margin:0;color:#78869b;font-size:13px;line-height:1.6}
.tabs{display:flex;gap:5px;margin-top:25px;background:#edf4fd;padding:5px;border-radius:13px}.tab{flex:1;border:0;border-radius:10px;padding:11px 4px;background:transparent;color:#65758b;font-size:14px;font-weight:750;cursor:pointer}.tab.active{background:white;color:#236bd2;box-shadow:0 2px 8px #276abd17}.tab:focus-visible,.preset:focus-visible,.copy:focus-visible{outline:3px solid #6aabff;outline-offset:2px}
.field{margin-top:24px}label{display:block;font-size:14px;font-weight:700;margin-bottom:10px}input,select{display:block;width:100%;padding:15px 17px;font-size:26px;font-weight:700;color:#17243b;border:1.5px solid #ccdaed;border-radius:13px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}input{letter-spacing:1px}input:focus,select:focus{border-color:#478cea;box-shadow:0 0 0 4px #e6f1ff}input[aria-invalid=true]{border-color:#de5564}
.amount-row{display:grid;grid-template-columns:minmax(0,1fr) 105px;gap:9px}.amount-row select{font-size:18px;padding:12px;letter-spacing:0}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.preset{flex:1 1 56px;border:1px solid #ccd9ec;color:#536477;background:white;border-radius:10px;padding:10px 4px;font-weight:700;cursor:pointer}.preset:hover{background:#eaf4ff}.preset.active{background:#2876e4;color:white;border-color:#2876e4}
.result{margin-top:22px;background:#f1f6fd;border-radius:14px;padding:24px 10px;text-align:center;min-height:123px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.result .subtitle{color:#72839b;font-size:13px}.result strong{font-size:34px;color:#2670df;letter-spacing:-.045em;word-break:break-word}
.results{border-collapse:collapse;width:100%;margin-top:15px;font-variant-numeric:tabular-nums}.results tr:not(:last-child){border-bottom:1px solid #e9eef4}.results td{padding:13px 7px;font-size:15px}.results td:first-child{width:30%;color:#75849a}.results td:last-child{font-weight:700;overflow-wrap:anywhere}
.formula{font-size:12px;color:#75849a;margin:19px 2px 11px;min-height:17px;line-height:1.6}.copy{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;border:1px solid #ccd9ed;background:white;color:#44576f;font-weight:750;cursor:pointer}.copy:hover{background:#f5faff}.copy:disabled{opacity:.45;cursor:default}.note{font-size:11px;color:#929faf;line-height:1.65;text-align:center;margin:16px 2px 0}.error{color:#c73d50;font-size:13px;text-align:center;margin:8px 0 0;min-height:19px}.warning{color:#a36a0a;background:#fff7e8;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.6;margin-top:12px}.hidden{display:none!important}
@media(max-width:380px){.app{padding:24px 17px}h1{font-size:23px}.result strong{font-size:29px}.presets{gap:5px}.preset{flex-basis:27%}.tab{font-size:12px}}
</style>
</head>
<body>
<main class="app">
<header><span class="badge">CAPACITOR CALCULATOR</span><h1>캐패시터 용량 계산기</h1><p>코드와 정전용량을 양방향으로 변환해 보세요.</p></header>
<div class="tabs" role="tablist" aria-label="계산 방향">
 <button id="tab-forward" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="forward">코드 → 용량</button>
 <button id="tab-reverse" class="tab" type="button" role="tab" aria-selected="false" aria-controls="reverse">용량 → 코드</button>
</div>
<section id="forward" role="tabpanel" aria-labelledby="tab-forward">
 <div class="field"><label for="code">캐패시터 코드</label><input id="code" value="474" inputmode="numeric" maxlength="3" autocomplete="off" spellcheck="false" aria-describedby="forward-error"></div>
 <div class="presets" aria-label="예시 코드">
  <button type="button" class="preset" data-code="103">103</button><button type="button" class="preset" data-code="104">104</button><button type="button" class="preset" data-code="224">224</button><button type="button" class="preset" data-code="474">474</button><button type="button" class="preset" data-code="105">105</button><button type="button" class="preset" data-code="225">225</button>
 </div>
 <p id="forward-error" class="error" role="status" aria-live="polite"></p>
 <section class="result" aria-live="polite"><span class="subtitle">변환 결과</span><strong id="highlight">470 nF</strong></section>
 <table class="results" aria-label="단위별 캐패시터 용량"><tbody><tr><td>pF</td><td id="pf">470,000 pF</td></tr><tr><td>nF</td><td id="nf">470 nF</td></tr><tr><td>µF</td><td id="uf">0.47 µF</td></tr><tr><td>F</td><td id="f">4.7e-7 F</td></tr></tbody></table>
 <p class="formula" id="formula">계산식: 47 × 10⁴ pF</p>
 <button class="copy" type="button" id="copy-forward"><span>▢</span><span id="copy-forward-text">결과 복사</span></button>
</section>
<section id="reverse" role="tabpanel" aria-labelledby="tab-reverse" class="hidden">
 <div class="field"><label for="amount">캐패시터 용량</label><div class="amount-row"><input id="amount" value="0.47" inputmode="decimal" autocomplete="off" spellcheck="false" aria-describedby="reverse-error"><select id="unit" aria-label="용량 단위"><option value="1">pF</option><option value="1000">nF</option><option value="1000000" selected>µF</option><option value="1000000000000">F</option></select></div></div>
 <div class="presets" aria-label="예시 용량"><button type="button" class="preset" data-amount="10" data-unit="1000">10 nF</button><button type="button" class="preset" data-amount="100" data-unit="1000">100 nF</button><button type="button" class="preset" data-amount="0.22" data-unit="1000000">0.22 µF</button><button type="button" class="preset" data-amount="0.47" data-unit="1000000">0.47 µF</button><button type="button" class="preset" data-amount="1" data-unit="1000000">1 µF</button></div>
 <p id="reverse-error" class="error" role="status" aria-live="polite"></p>
 <section class="result" aria-live="polite"><span class="subtitle" id="reverse-subtitle">캐패시터 코드</span><strong id="reverse-highlight">474</strong></section>
 <div id="reverse-warning" class="warning hidden"></div>
 <table class="results" aria-label="선택한 코드의 실제 정전용량"><tbody><tr><td>pF</td><td id="reverse-pf">470,000 pF</td></tr><tr><td>nF</td><td id="reverse-nf">470 nF</td></tr><tr><td>µF</td><td id="reverse-uf">0.47 µF</td></tr><tr><td>F</td><td id="reverse-f">4.7e-7 F</td></tr></tbody></table>
 <p class="formula" id="reverse-formula">계산식: 47 × 10⁴ pF</p>
 <button class="copy" type="button" id="copy-reverse"><span>▢</span><span id="copy-reverse-text">결과 복사</span></button>
</section>
<p class="note">일반적인 3자리 EIA 정전용량 코드 기준입니다.<br>세 자리로 표현할 수 없는 값은 가장 가까운 코드를 표시합니다.<br>정격전압과 허용오차는 별도로 확인해 주세요.</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const fmt=n=>Number(n.toPrecision(12)).toLocaleString('en-US',{maximumFractionDigits:12});
const superDigits={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const superNum=n=>String(n).split('').map(c=>superDigits[c]).join('');
const formatF=pf=>`${Number((pf/1e12).toPrecision(10)).toExponential()} F`;
function parseCode(raw){
 if(!/^\d{3}$/.test(raw)||Number(raw.slice(0,2))<10)return null;
 const sig=Number(raw.slice(0,2)),last=Number(raw[2]),exp=last===8?-2:last===9?-1:last;
 return{code:raw,pf:sig*10**exp,sig,exp};
}
function setUnits(prefix,pf){
 $(prefix+'pf').textContent=`${fmt(pf)} pF`;
 $(prefix+'nf').textContent=`${fmt(pf/1e3)} nF`;
 $(prefix+'uf').textContent=`${fmt(pf/1e6)} µF`;
 $(prefix+'f').textContent=formatF(pf);
}
function clearUnits(prefix){['pf','nf','uf','f'].forEach(u=>$(prefix+u).textContent='—');}
function equation(parsed){return `계산식: ${parsed.sig} × 10${superNum(parsed.exp)} pF`;}
let forwardResult=null,reverseResult=null;
function updateForward(){
 const raw=$('code').value.trim(),parsed=parseCode(raw),nonempty=raw.length>0;
 $('code').setAttribute('aria-invalid',String(nonempty&&!parsed));
 $('forward-error').textContent=nonempty&&!parsed?'10부터 시작하는 유효한 세 자리 코드를 입력해 주세요.':'';
 document.querySelectorAll('[data-code]').forEach(b=>b.classList.toggle('active',b.dataset.code===raw));
 if(!parsed){forwardResult=null;$('highlight').textContent='—';clearUnits('');$('formula').textContent='';$('copy-forward').disabled=true;return;}
 forwardResult=parsed;const pf=parsed.pf;
 $('highlight').textContent=pf>=1e6?`${fmt(pf/1e6)} µF`:pf>=1e3?`${fmt(pf/1e3)} nF`:`${fmt(pf)} pF`;
 setUnits('',pf);$('formula').textContent=equation(parsed);$('copy-forward').disabled=false;$('copy-forward-text').textContent='결과 복사';
}
// 3-digit EIA: last digit 0–7 is exponent; 8 and 9 denote -2 and -1.
// Generate all representable values, then select the nearest by relative error.
const candidateCodes=[];
for(let sig=10;sig<=99;sig++)for(let last=0;last<=9;last++){
 const exp=last===8?-2:last===9?-1:last;
 candidateCodes.push({code:`${sig}${last}`,sig,exp,pf:sig*10**exp});
}
function nearestCode(pf){
 let best=null,bestError=Infinity;
 for(const item of candidateCodes){
  const err=Math.abs(item.pf-pf)/pf;
  if(err<bestError-1e-14||(Math.abs(err-bestError)<1e-14&&best&&Number(item.code)<Number(best.code))){best=item;bestError=err;}
 }
 return{...best,error:bestError,exact:bestError<1e-10};
}
function updateReverse(){
 const raw=$('amount').value.trim(),num=Number(raw),unit=Number($('unit').value);
 const valid=raw!==''&&Number.isFinite(num)&&num>0&&Number.isFinite(num*unit)&&num*unit>0;
 $('amount').setAttribute('aria-invalid',String(raw!==''&&!valid));
 $('reverse-error').textContent=raw!==''&&!valid?'0보다 큰 유효한 정전용량을 입력해 주세요.':'';
 document.querySelectorAll('[data-amount]').forEach(b=>b.classList.toggle('active',Number(b.dataset.amount)===num&&Number(b.dataset.unit)===unit));
 if(!valid){reverseResult=null;$('reverse-highlight').textContent='—';$('reverse-subtitle').textContent='캐패시터 코드';$('reverse-warning').classList.add('hidden');clearUnits('reverse-');$('reverse-formula').textContent='';$('copy-reverse').disabled=true;return;}
 const pf=num*unit,smallest=0.1,largest=99*1e7;
 if(pf<smallest||pf>largest){
  reverseResult=null;$('reverse-highlight').textContent='—';$('reverse-subtitle').textContent='변환 범위 초과';$('reverse-warning').classList.add('hidden');clearUnits('reverse-');$('reverse-formula').textContent='';$('copy-reverse').disabled=true;
  $('reverse-error').textContent='이 계산기가 지원하는 3자리 코드 범위(0.1 pF ~ 990,000,000 pF)를 벗어났어요.';return;
 }
 const result=nearestCode(pf);reverseResult={...result,inputPf:pf};
 $('reverse-subtitle').textContent=result.exact?'캐패시터 코드':'가장 가까운 캐패시터 코드';
 $('reverse-highlight').textContent=result.code;
 const warning=$('reverse-warning');
 if(result.exact){warning.classList.add('hidden');warning.textContent='';}
 else{
  warning.classList.remove('hidden');
  warning.textContent=`입력값 ${fmt(pf)} pF는 3자리 코드로 정확히 표현할 수 없어요. 가장 가까운 ${result.code} (${fmt(result.pf)} pF)를 표시했어요. 차이: ${Number((result.error*100).toPrecision(4))}%.`;
 }
 setUnits('reverse-',result.pf);$('reverse-formula').textContent=equation(result);
 $('copy-reverse').disabled=false;$('copy-reverse-text').textContent='결과 복사';
}
async function copyText(text,label){
 try{
  if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
  else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy failed');}
  label.textContent='복사 완료!';
 }catch(e){label.textContent='복사 실패 — 다시 시도해 주세요';}
}
function switchTab(direction){
 const reverse=direction==='reverse';
 $('forward').classList.toggle('hidden',reverse);$('reverse').classList.toggle('hidden',!reverse);
 $('tab-forward').classList.toggle('active',!reverse);$('tab-reverse').classList.toggle('active',reverse);
 $('tab-forward').setAttribute('aria-selected',String(!reverse));$('tab-reverse').setAttribute('aria-selected',String(reverse));
 if(reverse)updateReverse();else updateForward();
}
$('tab-forward').addEventListener('click',()=>switchTab('forward'));
$('tab-reverse').addEventListener('click',()=>switchTab('reverse'));
$('code').addEventListener('input',updateForward);
document.querySelectorAll('[data-code]').forEach(b=>b.addEventListener('click',()=>{$('code').value=b.dataset.code;updateForward();$('code').focus();}));
$('amount').addEventListener('input',updateReverse);$('unit').addEventListener('change',updateReverse);
document.querySelectorAll('[data-amount]').forEach(b=>b.addEventListener('click',()=>{$('amount').value=b.dataset.amount;$('unit').value=b.dataset.unit;updateReverse();$('amount').focus();}));
$('copy-forward').addEventListener('click',()=>{if(forwardResult){const{code,pf}=forwardResult;copyText(`${code} = ${fmt(pf)} pF = ${fmt(pf/1e3)} nF = ${fmt(pf/1e6)} µF = ${pf/1e12} F`,$('copy-forward-text'));}});
$('copy-reverse').addEventListener('click',()=>{if(reverseResult){const{code,pf,exact,inputPf}=reverseResult;copyText(`${exact?'':'가장 가까운 코드: '}${code} = ${fmt(pf)} pF = ${fmt(pf/1e3)} nF = ${fmt(pf/1e6)} µF = ${pf/1e12} F${exact?'':` (요청값 ${fmt(inputPf)} pF와 다름)`}`,$('copy-reverse-text'));}});
updateForward();updateReverse();
</script>
</body>
</html>
